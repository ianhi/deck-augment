[project]
name = "deck-augment"
version = "0.1.0"
description = "Pipeline for enhancing Anki decks with LLM-bolded words, TTS audio, dedup, and repack."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.97.0",
    "genanki>=0.13.1",
    "tts-tools",
]

[dependency-groups]
dev = [
    "pyright",
    "ruff",
]

[tool.uv.sources]
tts-tools = { path = "../tts-tools", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyright]
include = ["*.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
